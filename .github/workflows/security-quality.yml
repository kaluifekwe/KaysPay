name: Security and quality

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Gitleaks needs full history, not just the merge commit.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type-check app
        run: npm run typecheck
      - name: Audit production dependencies
        run: npm run security:audit
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Test Edge security and VTU logic
        run: deno test --allow-env=VTUAFRICA_API_KEY,VTUNAIJA_API_KEY,SUPABASE_URL,SUPABASE_ANON_KEY,SUPABASE_SERVICE_ROLE_KEY,CRON_SECRET supabase/functions/_shared/*.test.ts

      - name: Exercise local resilience harness
        run: npm run load:test -- --requests=3000 --concurrency=100

      - name: Scan for committed secrets (Gitleaks)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Enforce read-only financial monitor
        shell: bash
        run: |
          if grep -En '(credit_wallet|debit_for_|complete_service_transaction|refund_service_transaction|refund_completed_service_transaction)' \
            supabase/functions/financial-integrity-monitor/index.ts \
            supabase/functions/_shared/financial-monitor.ts; then
            echo 'Financial monitor must never invoke a money-movement function.' >&2
            exit 1
          fi

      - name: Enforce admin functions check requireAdmin
        shell: bash
        run: |
          missing=0
          for f in supabase/functions/admin-*/index.ts; do
            # admin-bootstrap is the one legitimate exception: it creates the
            # FIRST super_admin, so requireAdmin (which needs an existing
            # admin_users row) is a chicken-and-egg impossibility there. It
            # gates on an explicitly allowlisted user ID instead
            # (isBootstrapOperator) -- see that file's own comment.
            [ "$f" = "supabase/functions/admin-bootstrap/index.ts" ] && continue
            if ! grep -q 'requireAdmin(' "$f"; then
              echo "Missing requireAdmin() call: $f" >&2
              missing=1
            fi
          done
          exit $missing

  semgrep:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write # needed to upload SARIF to the Security tab
    steps:
      - uses: actions/checkout@v4
      # Installed via pip rather than the semgrep/semgrep container image so
      # this job stays a normal runner -- github/codeql-action/upload-sarif
      # below is a JS action and needs a Node runtime, which that image
      # doesn't have.
      - name: Install Semgrep
        run: pip install semgrep
      - name: Community security rules (blocking)
        run: semgrep scan --config=p/security-audit --config=p/javascript --config=p/typescript --error
      - name: KaysPay-specific rules (informational)
        if: always()
        run: semgrep scan --config=.semgrep/kayspay-rules.yml
      - name: Generate SARIF for the Security tab
        if: always()
        run: semgrep scan --config=p/security-audit --config=p/javascript --config=p/typescript --config=.semgrep/kayspay-rules.yml --sarif --output=semgrep.sarif
      - name: Upload SARIF to Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif

  osv-scan:
    permissions:
      actions: read
      security-events: write
      contents: read
    uses: "google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@v2.5.0"
    with:
      scan-args: |-
        --recursive
        --config=.osv-scanner.toml
        ./
