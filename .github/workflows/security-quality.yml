name: Security and quality

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Gitleaks needs full history, not just the merge commit.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type-check app
        run: npm run typecheck
      # Dropped as a CI gate (2026-09-12): npm audit --audit-level=high has
      # no allowlist mechanism, so it can never pass while image-size/uuid
      # exist -- both already triaged and deliberately deferred (see
      # .osv-scanner.toml), transitive Metro/xcode/@expo/ngrok build-tooling
      # deps with no compatible upstream fix yet. The osv-scan job below
      # supersedes this: broader ecosystem coverage, and it correctly
      # recognizes those two as accepted risk instead of failing on them
      # forever. `npm run security:audit` still exists to run by hand.
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Test Edge security and VTU logic
        run: deno test --allow-env=VTUAFRICA_API_KEY,VTUNAIJA_API_KEY,SUPABASE_URL,SUPABASE_ANON_KEY,SUPABASE_SERVICE_ROLE_KEY,CRON_SECRET supabase/functions/_shared/*.test.ts

      - name: Exercise local resilience harness
        # Tuned for GitHub's shared runners (2 vCPUs): concurrency=100 against
        # an in-process server on that little compute caused heavy scheduling
        # contention, pushing far more requests past the 250ms timeout than
        # the harness deliberately makes slow (343 timed out vs. the ~60 by
        # design) -- confirmed 2026-09-12, failing the 90% success threshold
        # on CI noise, not a real regression. Lowering concurrency addresses
        # the actual cause (contention) rather than just padding the
        # timeout -- raising timeout alone to 800ms overshot the OTHER way,
        # so even the deliberately-slow (350ms) requests stopped timing out
        # at all, failing the "at least one timeout must occur" assertion.
        # concurrency=25 / timeout=400 verified stable across 3 local runs
        # (timedOut=1, succeeded=98.97%, real margin either direction).
        run: npm run load:test -- --requests=3000 --concurrency=25 --timeout=400

      - name: Scan for committed secrets (Gitleaks)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Enforce read-only financial monitor
        shell: bash
        run: |
          if grep -En '(credit_wallet|debit_for_|complete_service_transaction|refund_service_transaction|refund_completed_service_transaction)' \
            supabase/functions/financial-integrity-monitor/index.ts \
            supabase/functions/_shared/financial-monitor.ts; then
            echo 'Financial monitor must never invoke a money-movement function.' >&2
            exit 1
          fi

      - name: Enforce admin functions check requireAdmin
        shell: bash
        run: |
          missing=0
          for f in supabase/functions/admin-*/index.ts; do
            # admin-bootstrap is the one legitimate exception: it creates the
            # FIRST super_admin, so requireAdmin (which needs an existing
            # admin_users row) is a chicken-and-egg impossibility there. It
            # gates on an explicitly allowlisted user ID instead
            # (isBootstrapOperator) -- see that file's own comment.
            [ "$f" = "supabase/functions/admin-bootstrap/index.ts" ] && continue
            if ! grep -q 'requireAdmin(' "$f"; then
              echo "Missing requireAdmin() call: $f" >&2
              missing=1
            fi
          done
          exit $missing

  semgrep:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Semgrep
        run: pip install semgrep
      - name: Community security rules (blocking)
        run: semgrep scan --config=p/security-audit --config=p/javascript --config=p/typescript --error
      - name: KaysPay-specific rules (informational)
        if: always()
        run: semgrep scan --config=.semgrep/kayspay-rules.yml
      # No SARIF upload to the Security tab -- that needs GitHub Advanced
      # Security, which isn't available on a private repo without a paid
      # add-on. Confirmed via a real CI run (2026-09-12):
      # "Code scanning is not enabled for this repository." Findings still
      # show in this job's own log either way.

  osv-scan:
    # Full permission set kept even though upload-sarif is now false --
    # trimming this to just contents:read caused a startup_failure (the
    # whole workflow failed to even schedule jobs, confirmed via a real
    # run). The reusable workflow likely needs actions:read/security-events
    # internally regardless of whether the upload step itself runs.
    permissions:
      actions: read
      security-events: write
      contents: read
    uses: "google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@v2.5.0"
    with:
      upload-sarif: false # see the semgrep job's comment -- Code Scanning needs GitHub Advanced Security, unavailable on a private repo
      scan-args: |-
        --recursive
        --config=.osv-scanner.toml
        ./
