name: Security and quality

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type-check app
        run: npm run typecheck
      - name: Audit production dependencies
        run: npm run security:audit
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Test Edge security and VTU logic
        run: deno test --allow-env=VTUAFRICA_API_KEY,SUPABASE_URL,SUPABASE_ANON_KEY,SUPABASE_SERVICE_ROLE_KEY,CRON_SECRET supabase/functions/_shared/*.test.ts

      - name: Exercise local resilience harness
        run: npm run load:test -- --requests=3000 --concurrency=100

      - name: Reject committed credentials
        shell: bash
        run: |
          if git grep -nE '(BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|postgres(ql)?://[^[:space:]]+:[^[:space:]]+@|sk_(live|test)_[A-Za-z0-9]{16,})' -- ':!package-lock.json'; then
            echo 'Potential committed credential detected.' >&2
            exit 1
          fi

      - name: Enforce read-only financial monitor
        shell: bash
        run: |
          if grep -En '(credit_wallet|debit_for_|complete_service_transaction|refund_service_transaction|refund_completed_service_transaction)' \
            supabase/functions/financial-integrity-monitor/index.ts \
            supabase/functions/_shared/financial-monitor.ts; then
            echo 'Financial monitor must never invoke a money-movement function.' >&2
            exit 1
          fi
