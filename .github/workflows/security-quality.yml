name: Security and quality

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type-check app
        run: npm run typecheck
      - name: Audit production dependencies
        run: npm run security:audit
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Test VTU edge logic
        run: deno test --allow-env=VTUAFRICA_API_KEY supabase/functions/_shared/vtuafrica-client.test.ts
