# Per-function JWT verification, captured in version control instead of only
# living in dashboard clicks. Found during a security audit (2026-07-06) that
# this being unmanaged/invisible to code review is exactly how payroll-execute
# and vtuafrica-reconcile ended up deployed with verify_jwt=false and no
# in-code auth check — a gap that went unnoticed until the live deployment
# was checked directly. This file is the source of truth going forward;
# `supabase functions deploy` applies whatever's set here.
#
# Three groups, by actual security model:
#   1. Webhooks (external providers call these) — verify_jwt = false,
#      protected instead by their own HMAC/signature verification.
#   2. Cron-only (only pg_cron ever calls these) — verify_jwt = true AND
#      gated by a separate x-cron-secret header (see _shared/auth.ts,
#      verifyCronSecret) sourced from Supabase Vault. The anon key alone
#      isn't meaningful protection since it's public/bundled in the app, but
#      keeping verify_jwt on too costs nothing and adds a layer.
#   3. Everything else — real user-facing functions, verify_jwt = true,
#      identity resolved server-side from the JWT via getAuthUser().

# --- Webhooks: own signature verification, no JWT ---
[functions.flutterwave-webhook]
verify_jwt = false

[functions.vtu-webhook]
verify_jwt = false

# --- Cron-only: JWT + separate x-cron-secret check ---
[functions.vtu-reconcile]
verify_jwt = true

[functions.nin-reconcile]
verify_jwt = true

[functions.vtuafrica-reconcile]
verify_jwt = true

[functions.fx-sync]
verify_jwt = true

[functions.airalo-balance-check]
verify_jwt = true

[functions.notifications-push]
verify_jwt = true

[functions.welcome-email]
verify_jwt = true

# --- User-facing: identity from JWT via getAuthUser() ---
[functions.bvn-verify]
verify_jwt = true

[functions.create-virtual-account]
verify_jwt = true

[functions.send-email-otp]
verify_jwt = true

[functions.verify-email-otp]
verify_jwt = true

# Forgot-password: called by a logged-OUT user with the app's anon key
# (satisfies verify_jwt). Identity is the email in the body, proven only by
# the emailed reset code — see send-/verify-password-reset.
[functions.send-password-reset]
verify_jwt = true

[functions.verify-password-reset]
verify_jwt = true

[functions.kyc-verify-nin]
verify_jwt = true

[functions.esim-browse]
verify_jwt = true

[functions.esim-catalog]
verify_jwt = true

[functions.esim-purchase]
verify_jwt = true

[functions.foreign-number-cancel]
verify_jwt = true

[functions.foreign-number-reconcile]
verify_jwt = true

[functions.smspva-balance-check]
verify_jwt = true

[functions.smspva-catalog-sync]
verify_jwt = true

[functions.foreign-number-countries]
verify_jwt = true

[functions.foreign-number-price]
verify_jwt = true

[functions.foreign-number-purchase]
verify_jwt = true

[functions.foreign-number-services]
verify_jwt = true

[functions.foreign-number-status]
verify_jwt = true

[functions.nin-modify]
verify_jwt = true

[functions.nin-validate]
verify_jwt = true

[functions.nin-verify]
verify_jwt = true

[functions.vtu-purchase]
verify_jwt = true

# On-demand single-order settlement, called by the result screen while it
# shows "Processing" — identity from JWT, and it only settles the caller's
# own order.
[functions.vtu-verify-order]
verify_jwt = true
